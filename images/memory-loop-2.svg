<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="loopg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="50%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#loopg2)"/>
  <g>
    <text x="160" y="350" font-size="32" opacity="0.8">
      🌸
      <animate attributeName="y" values="420;80" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="240" y="380" font-size="40" opacity="0.8">
      💗
      <animate attributeName="y" values="440;60" dur="4s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="1s" repeatCount="indefinite"/>
    </text>
    <text x="340" y="390" font-size="36" opacity="0.8">
      ✨
      <animate attributeName="y" values="430;70" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
    </text>
    <text x="420" y="410" font-size="34" opacity="0.8">
      💕
      <animate attributeName="y" values="450;90" dur="5.5s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="5.5s" begin="2s" repeatCount="indefinite"/>
    </text>
  </g>
  <g transform="translate(300, 220)">
    <circle cx="0" cy="0" r="65" fill="#ffffff" stroke="#e91e63" stroke-width="4" filter="drop-shadow(0 8px 16px rgba(233,30,99,0.2))"/>
    <text x="0" y="18" font-size="48" text-anchor="middle">
      🎀
      <animateTransform attributeName="transform" type="rotate" values="-5;5;-5" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>
  <text x="300" y="370" font-family="'Dancing Script', cursive, sans-serif" font-size="30" font-weight="bold" fill="#ad1457" text-anchor="middle">Cherished Always 🌸✨</text>
</svg>