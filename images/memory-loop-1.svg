<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="loopg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e0c27"/>
      <stop offset="50%" stop-color="#58163f"/>
      <stop offset="100%" stop-color="#8c1d58"/>
    </linearGradient>
    <radialGradient id="coreglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4081" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff4081" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#loopg1)"/>
  <circle cx="300" cy="210" r="140" fill="url(#coreglow)">
    <animate attributeName="r" values="120;160;120" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(300, 210)">
    <ellipse cx="0" cy="0" rx="160" ry="50" fill="none" stroke="#f8bbd0" stroke-width="2" stroke-dasharray="6 10" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="160" ry="50" fill="none" stroke="#ffd54f" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="16s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <g transform="translate(300, 210)">
    <text x="0" y="20" font-size="72" text-anchor="middle">
      💖
      <animateTransform attributeName="transform" type="scale" values="1;1.2;1" dur="1.8s" repeatCount="indefinite" additive="sum"/>
    </text>
  </g>
  <text x="300" y="370" font-family="'Dancing Script', cursive, sans-serif" font-size="28" font-weight="bold" fill="#fce4ec" text-anchor="middle">Our Infinite Orbit 🪐💗</text>
</svg>